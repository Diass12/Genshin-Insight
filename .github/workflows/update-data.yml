name: Update game data

on:
  schedule:
    # Runs once a day. genshin-db itself usually updates 1-2 days after a
    # patch, so this keeps the repo in sync without any manual step.
    - cron: '17 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependencies
        working-directory: scripts
        run: npm install --no-save

      - name: Generate data package
        working-directory: scripts
        run: npm run generate

      - name: Commit updated data
        run: |
          git config user.name "genshin-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: auto-update game data"
            git push
          fi
